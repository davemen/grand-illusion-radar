<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Illusion Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232997ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5f5f7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#000;
  --graphite:#0e0e0e;
  --carbon:#1d1d1f;
  --steel:#333336;
  --keyline:#282828;
  --slate:#6e6e73;
  --ash:#86868b;
  --porcelain:#f5f5f7;
  --blue:#0071e3;
  --link:#2997ff;
  --copper:#e8762d; /* #b64400 lightened to #e8762d on black for contrast */
  --yellow:#ffd500;
  --capsule:rgba(66,66,69,.72);
  --fill:rgba(255,255,255,.04);
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(24px,4vw,56px);
  --radius-media:18px;
  --radius-panel:28px;
  --radius-pill:980px;
  --nav-h:48px;
  color-scheme:dark;
}
@media(max-width:639px){
  :root{
    --gutter:16px;
    --radius-media:14px;
    --nav-h:88px;
  }
  body.static{
    --nav-h:88px;
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#000;
  color:var(--porcelain);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
  font-size:14px;
  line-height:1.29;
  letter-spacing:-0.224px;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
b,strong{font-weight:600}
button,input,select{
  font:inherit;
  color:inherit;
  letter-spacing:inherit;
}
a{color:var(--link);text-decoration:none}
:focus{outline:none}
:focus-visible{
  outline:1px solid var(--blue);
  outline-offset:1px;
}
.hidden{display:none!important}

.container{
  max-width:1600px;
  margin:0 auto;
  padding-inline:var(--gutter);
}

/* ── 1. Sticky Global Nav ─────────────────────────── */
.global-nav{
  position:sticky;
  top:0;
  z-index:40;
  min-height:48px;
  background:rgba(14,14,14,.8);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--keyline);
}
.nav-inner{
  max-width:1600px;
  margin:0 auto;
  padding-inline:var(--gutter);
  min-height:48px;
  display:flex;
  align-items:center;
  gap:12px;
}
.wordmark{
  font-size:17px;
  font-weight:600;
  letter-spacing:-0.3px;
  color:var(--porcelain);
  white-space:nowrap;
  margin-right:auto;
}
.nav-search{
  flex:0 1 360px;
  min-width:180px;
}
#q{
  width:100%;
  height:32px;
  padding:0 14px;
  border-radius:var(--radius-pill);
  background:var(--fill);
  border:1px solid var(--slate);
  color:var(--porcelain);
  font-size:13px;
  transition:border-color 250ms var(--ease),background-color 250ms var(--ease);
}
#q::placeholder{color:var(--ash)}
#q:focus-visible{border-color:var(--blue)}
.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.pill-btn{
  height:32px;
  padding:0 14px;
  border-radius:var(--radius-pill);
  border:none;
  background:var(--capsule);
  color:var(--porcelain);
  font-size:13px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color 250ms var(--ease),color 250ms var(--ease),opacity 250ms var(--ease);
}
.pill-btn.blue{
  background:var(--blue);
  color:var(--porcelain);
}
.pill-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
@media(hover:hover){
  .pill-btn:hover:not(:disabled){background:var(--steel)}
  .pill-btn.blue:hover:not(:disabled){background:#0077ed}
}
@media(max-width:639px){
  .nav-inner{
    flex-wrap:wrap;
    padding-block:8px;
    gap:8px;
  }
  .wordmark{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:15px;
  }
  .nav-actions{gap:6px}
  .nav-actions .pill-btn{padding:0 12px;font-size:12px}
  .nav-search{
    order:3;
    flex:1 0 100%;
    min-width:0;
  }
}

/* ── 2. Scanbar ───────────────────────────────────── */
#scanbar{
  display:none;
  background:var(--graphite);
  border-bottom:1px solid var(--keyline);
}
#scanbar.on{display:block}
.scanbar-inner{
  max-width:1600px;
  margin:0 auto;
  padding:8px var(--gutter);
  display:flex;
  flex-direction:column;
  gap:6px;
}
#scanlog{
  font-size:12px;
  color:var(--ash);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.scan-track{
  height:2px;
  width:100%;
  background:var(--keyline);
  border-radius:var(--radius-pill);
  overflow:hidden;
}
#barfill{
  display:block;
  height:100%;
  width:0%;
  background:var(--blue);
  transition:width 250ms var(--ease);
}
body.static #quick,
body.static #deep,
body.static #scanbar{
  display:none!important;
}

/* ── 3. Hero ──────────────────────────────────────── */
.hero{
  padding-block:clamp(32px,5vw,64px) clamp(20px,3vw,32px);
}
.hero h1{
  margin:0;
  font-size:clamp(40px,7vw,80px);
  line-height:1.05;
  font-weight:600;
  letter-spacing:-0.015em;
  color:var(--porcelain);
}
.hero h1 .hero-sub{
  color:var(--ash);
  font-weight:600;
}
#stats{
  margin-top:16px;
  font-size:14px;
  color:var(--ash);
  font-variant-numeric:tabular-nums;
}
#stats b{
  color:var(--porcelain);
  font-weight:600;
}
#snapshot{
  margin:6px 0 0;
  font-size:12px;
  color:var(--ash);
}
#snapshot:empty{display:none}

/* ── 4. Sticky Chip Row ───────────────────────────── */
#chipbar{
  position:sticky;
  top:var(--nav-h);
  z-index:30;
  background:#000;
  border-top:1px solid var(--keyline);
  border-bottom:1px solid var(--keyline);
}
.chipbar-track{
  max-width:1600px;
  margin:0 auto;
  padding:12px var(--gutter);
  display:flex;
  align-items:center;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chipbar-track::-webkit-scrollbar{display:none}
.chip-group{
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.chip-group + .chip-group{
  padding-left:12px;
  border-left:1px solid var(--keyline);
}
.chip{
  height:32px;
  padding:0 14px;
  border-radius:var(--radius-pill);
  border:none;
  background:var(--capsule);
  color:var(--porcelain);
  font-size:13px;
  font-weight:500;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  white-space:nowrap;
  user-select:none;
  transition:background-color 250ms var(--ease),color 250ms var(--ease);
}
.chip .cnt{
  color:var(--ash);
  font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"],
.chip.on{
  background:var(--porcelain);
  color:#000;
}
.chip[aria-pressed="true"] .cnt,
.chip.on .cnt{
  color:var(--slate);
}
@media(hover:hover){
  .chip:hover:not([aria-pressed="true"]):not(.on){
    background:var(--steel);
  }
}

/* ── 5. Advanced Filters Panel (#more) ────────────── */
.more-wrap{
  padding-top:16px;
}
#more{
  background:var(--carbon);
  border-radius:var(--radius-panel);
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.more-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 16px;
}
.field{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.lbl{
  font-size:12px;
  color:var(--ash);
  font-weight:500;
  white-space:nowrap;
}
.more-input,.more-select{
  height:32px;
  padding:0 12px;
  border-radius:var(--radius-pill);
  background:var(--fill);
  border:1px solid var(--steel);
  color:var(--porcelain);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.more-input{width:108px}
.more-input::placeholder{color:var(--ash)}
.more-select{cursor:pointer}
.more-select option{background:var(--carbon);color:var(--porcelain)}
.chips-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
}
.link-btn{
  background:none;
  border:none;
  padding:0;
  color:var(--link);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
}
@media(hover:hover){
  .link-btn:hover{text-decoration:underline}
}
#clear{margin-left:auto}

/* ── 6. Main Content: Shelves & Grid ──────────────── */
main#content{
  padding-top:36px;
  padding-bottom:64px;
  min-height:45vh;
}
.shelf{
  margin-bottom:48px;
}
.shelf:last-child{
  margin-bottom:0;
}
@media(max-width:639px){
  .shelf{margin-bottom:36px}
}
.shelf-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}
.shelf-title-wrap{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:6px 10px;
  min-width:0;
}
.shelf-head h2,.grid-head h2{
  margin:0;
  font-size:clamp(22px,2.2vw,24px);
  line-height:1.18;
  font-weight:600;
  letter-spacing:-0.3px;
  color:var(--porcelain);
}
.shelf-count{
  font-size:14px;
  font-weight:500;
  color:var(--ash);
  font-variant-numeric:tabular-nums;
}
.shelf-sub{
  width:100%;
  margin:0;
  font-size:12px;
  color:var(--ash);
}
.shelf-nav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.arrow-btn{
  display:none;
  width:32px;
  height:32px;
  border-radius:var(--radius-pill);
  border:none;
  background:var(--capsule);
  color:var(--porcelain);
  font-size:18px;
  line-height:1;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background-color 250ms var(--ease);
}
@media(hover:hover){
  .arrow-btn{display:inline-flex}
  .arrow-btn:hover{background:var(--steel)}
}
.track{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:clamp(156px,43vw,236px);
  gap:16px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.track::-webkit-scrollbar{display:none}
.track > *{
  scroll-snap-align:start;
}
@media(max-width:639px){
  .track{
    gap:12px;
    margin-inline:calc(-1 * var(--gutter));
    padding-inline:var(--gutter);
    scroll-padding-inline:var(--gutter);
  }
}

/* Grid view */
.grid-head{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  margin-bottom:24px;
}
.grid-title-row{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:12px;
  row-gap:24px;
}
@media(min-width:640px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    column-gap:16px;
    row-gap:32px;
  }
}
@media(min-width:1000px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
@media(min-width:1400px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}
.more-row-btn{
  margin-top:36px;
  display:flex;
  justify-content:center;
}

/* ── Card ─────────────────────────────────────────── */
.card{
  position:relative;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.card .hit{
  appearance:none;
  background:none;
  border:none;
  padding:0;
  margin:0;
  text-align:left;
  color:inherit;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  width:100%;
  border-radius:var(--radius-media);
}
.tile{
  aspect-ratio:4 / 5;
  width:100%;
  background:var(--carbon);
  border-radius:var(--radius-media);
  overflow:hidden;
  position:relative;
}
.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 400ms var(--ease);
}
@media(hover:hover){
  .card:hover .tile img{
    transform:scale(1.03);
  }
}
.tile .nophoto{
  display:none;
  position:absolute;
  inset:0;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--ash);
  font-size:12px;
}
.tile.none .nophoto{
  display:flex;
}
.tile-flags{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  z-index:2;
  pointer-events:none;
}
.cap-flag{
  font-size:11px;
  font-weight:600;
  line-height:1;
  padding:5px 9px;
  border-radius:var(--radius-pill);
  background:var(--capsule);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  color:var(--porcelain);
}
.save-btn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:3;
  width:32px;
  height:32px;
  border-radius:var(--radius-pill);
  border:none;
  background:var(--capsule);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  color:var(--porcelain);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0;
  cursor:pointer;
  transition:background-color 250ms var(--ease),color 250ms var(--ease);
}
.save-btn[aria-pressed="true"]{
  background:var(--porcelain);
  color:#000;
}
.save-btn[aria-pressed="true"] svg path{
  fill:currentColor;
}
@media(hover:hover){
  .save-btn:hover:not([aria-pressed="true"]){
    background:var(--steel);
  }
}
.see-all-tile{
  border:none;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--link);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:background-color 250ms var(--ease);
}
@media(hover:hover){
  .see-all-tile:hover{background:var(--steel)}
}

.txt{
  padding-top:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.line-price{
  display:flex;
  align-items:baseline;
  gap:6px;
  flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}
.price{
  font-size:20px;
  font-weight:600;
  line-height:1.15;
  color:var(--porcelain);
  font-variant-numeric:tabular-nums;
}
.price.req{
  font-size:15px;
  font-weight:500;
  color:var(--ash);
}
.deal-pct{
  font-size:15px;
  font-weight:600;
  color:var(--yellow);
  font-variant-numeric:tabular-nums;
}
.deal-bid{
  font-size:12px;
  font-weight:400;
  color:var(--ash);
}
.line-name{
  font-size:14px;
  font-weight:500;
  line-height:1.29;
  color:var(--porcelain);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.new-lbl{
  font-size:12px;
  font-weight:600;
  color:var(--copper);
  margin-right:5px;
}
.line-builder{
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:rgba(245,245,247,.72);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.line-log{
  font-size:12px;
  color:var(--ash);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.line-log.dim{
  color:var(--slate);
}
.line-src{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:2px;
  font-size:11px;
  color:var(--ash);
}
.src-badge{
  font-size:11px;
  font-weight:500;
  border:1px solid var(--steel);
  border-radius:var(--radius-pill);
  padding:1px 7px;
  color:var(--ash);
  white-space:nowrap;
}
.age-lbl{
  font-size:11px;
  color:var(--ash);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ── Empty State ──────────────────────────────────── */
#empty{
  padding:72px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:12px;
  color:var(--ash);
}
#empty p{
  margin:0;
  font-size:15px;
  color:var(--ash);
}

/* ── 7. Footer Band ───────────────────────────────── */
.site-footer{
  background:linear-gradient(#1d1d1f,#000 288px);
  border-top:1px solid var(--keyline);
  padding:40px 0 56px;
}
.footer-head{
  margin:0 0 16px;
  font-size:14px;
  font-weight:600;
  color:var(--porcelain);
}
#health{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:8px 24px;
  padding-bottom:24px;
  border-bottom:1px solid var(--keyline);
}
.src-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--ash);
  min-width:0;
}
.src-row b{
  color:var(--porcelain);
  font-weight:500;
  white-space:nowrap;
}
.src-row .n{
  color:var(--ash);
  font-variant-numeric:tabular-nums;
}
.src-row .note{
  color:var(--slate);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--steel);
  flex:0 0 8px;
}
.dot.ok{background:#30d158}
.dot.empty{background:var(--ash)}
.dot.error,.dot.blocked{background:#ff453a}
@keyframes pulse-dot{
  0%,100%{opacity:1}
  50%{opacity:.4}
}
.dot.run{
  background:var(--blue);
  animation:pulse-dot 1.2s ease-in-out infinite;
}
#manual{
  padding:20px 0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 18px;
  font-size:12px;
  color:var(--ash);
}
#manual a{
  color:var(--link);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.fineprint{
  margin:8px 0 0;
  font-size:12px;
  color:var(--ash);
}

/* ── 8. Detail Sheet (<dialog id="sheet">) ────────── */
@keyframes sheet-in{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
#sheet{
  padding:0;
  border:1px solid var(--keyline);
  background:var(--carbon);
  color:var(--porcelain);
  border-radius:var(--radius-panel);
  max-width:960px;
  width:calc(100% - 32px);
  max-height:90dvh;
  overflow-y:auto;
}
#sheet[open]{
  animation:sheet-in 250ms var(--ease);
}
#sheet::backdrop{
  background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.sheet-inner{
  position:relative;
  padding:28px;
  display:grid;
  grid-template-columns:minmax(0,400px) minmax(0,1fr);
  gap:28px;
  align-items:start;
}
.sheet-close{
  position:sticky;
  top:16px;
  float:right;
  z-index:5;
  width:32px;
  height:32px;
  margin:16px 16px -48px auto;
  border-radius:var(--radius-pill);
  border:none;
  background:var(--capsule);
  color:var(--porcelain);
  font-size:18px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.sheet-media{
  aspect-ratio:4 / 5;
  width:100%;
  background:#000;
  border-radius:var(--radius-media);
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sheet-media img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.sheet-media .nophoto{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:var(--ash);
  font-size:12px;
}
.sheet-media.none .nophoto{display:flex}
.sheet-info{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:0;
  padding-right:28px;
}
.sheet-eyebrow{
  font-size:12px;
  font-weight:500;
  color:var(--ash);
}
.sheet-title{
  margin:0;
  font-size:32px;
  line-height:1.1;
  font-weight:600;
  letter-spacing:-0.4px;
  color:var(--porcelain);
}
.sheet-price-row{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.sheet-price{
  font-size:28px;
  font-weight:600;
  color:var(--porcelain);
  font-variant-numeric:tabular-nums;
}
.sheet-price.req{
  font-size:20px;
  color:var(--ash);
}
.sheet-deal{
  font-size:20px;
  font-weight:600;
  color:var(--yellow);
  font-variant-numeric:tabular-nums;
}
.sheet-basis{
  font-size:12px;
  color:var(--ash);
}
.sheet-log{
  font-size:13px;
  color:var(--ash);
}
.sheet-raw{
  padding-top:8px;
  border-top:1px solid var(--keyline);
}
.sheet-raw .lbl{
  display:block;
  margin-bottom:4px;
}
.sheet-raw-title{
  font-size:14px;
  color:var(--porcelain);
}
.kv-list{
  border-top:1px solid var(--keyline);
  margin:4px 0;
}
.kv-row{
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:8px 0;
  border-bottom:1px solid var(--keyline);
  font-size:12px;
}
.kv-row dt{
  color:var(--ash);
  flex-shrink:0;
}
.kv-row dd{
  margin:0;
  color:var(--porcelain);
  text-align:right;
  word-break:break-word;
}
.sheet-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding-top:8px;
}
@media(max-width:639px){
  #sheet{
    margin:auto 0 0 0;
    width:100%;
    max-width:none;
    max-height:92dvh;
    border-radius:var(--radius-panel) var(--radius-panel) 0 0;
    border-bottom:none;
  }
  .sheet-inner{
    grid-template-columns:1fr;
    padding:20px 16px 28px;
    gap:20px;
  }
  .sheet-info{
    padding-right:0;
  }
}

/* ── Reduced Motion ───────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
  .card:hover .tile img{
    transform:none!important;
  }
}
</style>
</head>
<body>
<header class="global-nav">
  <div class="nav-inner">
    <div class="wordmark">Grand Illusion Radar</div>
    <div class="nav-search">
      <input type="search" id="q" placeholder="Search zig zag, Owen, Abbott…" aria-label="Search illusions">
    </div>
    <div class="nav-actions">
      <button type="button" class="pill-btn blue" id="quick">Quick scan</button>
      <button type="button" class="pill-btn" id="deep">Deep sweep</button>
    </div>
  </div>
</header>

<div id="scanbar">
  <div class="scanbar-inner">
    <div id="scanlog">Standing by…</div>
    <div class="scan-track"><i id="barfill"></i></div>
  </div>
</div>

<section class="hero container">
  <h1>Stage illusions.<span class="hero-sub"> The best finds, priced against real comps.</span></h1>
  <div id="stats"></div>
  <p id="snapshot"></p>
</section>

<nav id="chipbar" aria-label="Filters">
  <div class="chipbar-track">
    <div class="chip-group" id="type-chips"></div>
    <div class="chip-group" id="price-chips">
      <button type="button" class="chip on" data-price="" aria-pressed="true">Any price</button>
      <button type="button" class="chip" data-price="u1k" aria-pressed="false">Under $1k</button>
      <button type="button" class="chip" data-price="1k-5k" aria-pressed="false">$1k–$5k</button>
      <button type="button" class="chip" data-price="5k+" aria-pressed="false">$5k+</button>
    </div>
    <div class="chip-group" id="fulfil-chips">
      <button type="button" class="chip on" data-fulfil="" aria-pressed="true">Any</button>
      <button type="button" class="chip" data-fulfil="pickup" aria-pressed="false">Pickup</button>
      <button type="button" class="chip" data-fulfil="ships" aria-pressed="false">Ships</button>
    </div>
    <div class="chip-group">
      <button type="button" class="chip" id="f-overseas" aria-pressed="false">Hide overseas</button>
      <button type="button" class="chip" id="f-deals" aria-pressed="false">Deals only</button>
      <button type="button" class="chip" id="f-saved" aria-pressed="false">Saved</button>
      <button type="button" class="chip" id="f-more" aria-pressed="false" aria-controls="more">Filters</button>
    </div>
  </div>
</nav>

<div class="container more-wrap">
  <section id="more" class="hidden" aria-label="Advanced filters">
    <div class="more-row">
      <label class="field"><span class="lbl">Min $</span><input type="number" id="min" class="more-input" placeholder="0"></label>
      <label class="field"><span class="lbl">Max $</span><input type="number" id="max" class="more-input" placeholder="Any"></label>
      <label class="field"><span class="lbl">Sort</span>
        <select id="sort" class="more-select">
          <option value="deal">Best deal</option>
          <option value="new">Newest</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="best">Best match</option>
        </select>
      </label>
    </div>
    <div class="more-row">
      <span class="lbl">Verdict</span>
      <div class="chips-wrap" id="verdicts"></div>
    </div>
    <div class="more-row">
      <span class="lbl">Source</span>
      <div class="chips-wrap" id="sources"></div>
    </div>
    <div class="more-row">
      <div class="chips-wrap">
        <button type="button" class="chip on" id="f-forsale" aria-pressed="true">For sale only</button>
        <button type="button" class="chip on" id="f-jev" aria-pressed="true" title="Hide listings TypeSafe Jev rates as not a stage illusion">Hide non-illusions</button>
      </div>
      <button type="button" class="link-btn" id="clear">Reset filters</button>
    </div>
  </section>
</div>

<main id="content" class="container">
  <div id="stage"></div>
  <div id="empty" class="hidden">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="30" height="26" rx="1"/><path d="M5 12h30M5 28h30M10 12v16M30 12v16M10 12l20 16M30 12L10 28"/></svg>
    <p>No illusions match these filters.</p>
    <button type="button" class="link-btn" id="empty-reset">Reset filters</button>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <h2 class="footer-head">Sources</h2>
    <div id="health"></div>
    <div id="manual"></div>
    <p class="fineprint">Prices compared against observed asking prices of the same class of object.</p>
  </div>
</footer>

<dialog id="sheet"></dialog>

<script src="app.js" defer></script>
</body>
</html>
